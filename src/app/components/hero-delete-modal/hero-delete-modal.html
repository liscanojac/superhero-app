<h2 mat-dialog-title>Remove hero?</h2>
<mat-dialog-content>
  <p class="hero-delete-modal-message">
    Are you sure you want to remove <strong>{{ data.heroName }}</strong> from your list?
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-dialog-close class="hero-delete-modal-btn hero-delete-modal-btn-cancel">
    Cancel
  </button>
  <button
    type="button"
    class="hero-delete-modal-btn hero-delete-modal-btn-remove"
    [mat-dialog-close]="true"
  >
    Remove
  </button>
</mat-dialog-actions>
